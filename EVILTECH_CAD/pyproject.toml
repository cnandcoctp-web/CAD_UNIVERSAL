[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eviltech-cad"
version = "1.0.0rc1"
description = "Deterministic engineering operating system for EvilTech CAD"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "EvilTech CAD" }]
dependencies = [
    "numpy",
    "scipy",
]
keywords = ["cad", "engineering", "simulation", "geometry", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
eviltech-cad = "main:main"

[tool.setuptools]
py-modules = ["main"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
    "AI*",
    "CONSTRAINTS*",
    "CORE*",
    "DATA*",
    "DESIGN_CONTEXT*",
    "ENGINEERING*",
    "GEOMETRY*",
    "IO*",
    "MATH_ENGINE*",
    "MODELING*",
    "RENDERING*",
    "SIMULATION*",
    "TOOLS*",
    "UI*",
    "UTILS*",
]
exclude = ["TEST*"]
namespaces = true